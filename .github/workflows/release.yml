name: Release + Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.2.0). Optional leading v is stripped.
        required: true
        type: string

permissions:
  id-token: write # Required for OIDC
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-and-publish:
    name: Bump version, commit/tag, and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release from the branch selected in the Actions UI (usually main).
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bump version, commit, and create tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $INPUT_VERSION"
            exit 1
          fi

          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "package.json is already at $VERSION"
            exit 1
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            exit 1
          fi

          # Updates package.json + package-lock.json, commits, and creates v* tag.
          npm version "$VERSION" -m "chore: release v%s"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Push commit and tag
        run: git push --atomic origin "HEAD:${{ github.ref_name }}" "$(git describe --tags --exact-match HEAD)"

      - name: Publish to npm
        run: npm publish
